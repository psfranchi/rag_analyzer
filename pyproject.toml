[project]
name = "rag-analyzer"
version = "0.1.0"
description = "Local dual-model RAG analyzer template (Ollama embed + generate, pgvector, DomainAdapter)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy==2.0.41",
    "pgvector==0.4.1",
    "psycopg[binary]==3.2.9",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.1.1",
    "requests==2.32.4",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "scripts", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
